# Perfil usado apenas na demonstracao publica hospedada no Render.
# A aplicacao continua pronta para o Oracle da FIAP por padrao (ver
# application.properties); este perfil so troca o banco por um H2 em
# memoria quando a variavel SPRING_PROFILES_ACTIVE=render esta definida
# no servico do Render, para a demo nao depender de credenciais pessoais
# do Oracle da FIAP (acesso individual, nao compartilhavel com o deploy).
# O DataSeeder popula os dados de demonstracao normalmente a cada start.

spring.datasource.url=jdbc:h2:mem:alerta360demo;MODE=LEGACY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
