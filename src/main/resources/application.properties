# Alerta360 - CitizenTech - Jardim Helena (SP)
# Configuracao do banco de dados Oracle (Oracle FIAP).
# As credenciais NAO ficam fixas no codigo: vem de variaveis de ambiente.
# Ao rodar localmente, defina-as antes de iniciar a aplicacao (veja README.md).
#   Windows (PowerShell): $env:DB_USER="RMxxxxxx"; $env:DB_PASSWORD="suaSenha"
#   Linux/Mac:             export DB_USER=RMxxxxxx DB_PASSWORD=suaSenha

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:RM000000}
spring.datasource.password=${DB_PASSWORD:senha_nao_definida}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema Oracle da FIAP e compartilhado entre varios alunos: "update" cria/
# ajusta somente as tabelas com prefixo ALR_ (ver prefixo nas entidades) sem
# apagar dados de outras disciplinas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta HTTP. O render.com injeta a variavel PORT automaticamente no deploy.
server.port=${PORT:8080}

spring.application.name=alerta360
