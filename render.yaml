# Blueprint opcional para deploy no render.com via "New + > Blueprint".
# Caso prefira, o deploy tambem pode ser feito manualmente como
# "New + > Web Service" apontando para este repositorio (Render detecta o
# Dockerfile automaticamente). Veja README.md para o passo a passo completo.

services:
  - type: web
    name: alerta360-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
